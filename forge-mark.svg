<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Project 52 wall rebuild</title>
  <desc id="d">A fortified stone wall rises course by course beneath rugged mountain ridges, with scaffolding marking the work still ahead.</desc>
  <defs>
